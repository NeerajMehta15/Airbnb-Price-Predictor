name: CI - Continuous Integration

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort
          pip install -r requirements.txt

      - name: Run Black (Code Formatting)
        run: |
          echo "Checking code formatting with Black..."
          black --check --diff src/ tests/

      - name: Run isort (Import Sorting)
        run: |
          echo "Checking import sorting with isort..."
          isort --check-only --diff src/ tests/

      - name: Run Flake8 (Linting)
        run: |
          echo "Running Flake8 linter..."
          flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503

  # Job 2: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests with pytest
        run: |
          echo "Running unit tests..."
          pytest tests/ -v --tb=short --disable-warnings

      - name: Generate coverage report
        if: matrix.python-version == '3.10'
        run: |
          pip install pytest-cov
          pytest tests/ --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to artifacts
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  # Job 3: Security Scan
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety (Dependency Vulnerability Check)
        continue-on-error: true
        run: |
          echo "Checking for known security vulnerabilities in dependencies..."
          safety check --json || echo "Safety check completed with warnings"

      - name: Run Bandit (Code Security Analysis)
        continue-on-error: true
        run: |
          echo "Running security analysis with Bandit..."
          bandit -r src/ -f json -o bandit-report.json || echo "Bandit scan completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: bandit-report.json

  # Job 4: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: airbnb-price-predictor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t airbnb-predictor:test .
          echo "Docker image built successfully!"

  # Job 5: Integration Tests (Optional)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run with docker-compose
        run: |
          docker-compose up -d
          sleep 10

      - name: Test API health endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1
          echo "API health check passed!"

      - name: Stop containers
        run: docker-compose down

  # Job 6: Build Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, test, security, build, integration-test]
    if: always()
    steps:
      - name: CI Results
        run: |
          echo "=========================================="
          echo "CI Pipeline Completed!"
          echo "=========================================="
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"
          echo "✅ Unit Tests: ${{ needs.test.result }}"
          echo "✅ Security Scan: ${{ needs.security.result }}"
          echo "✅ Docker Build: ${{ needs.build.result }}"
          echo "✅ Integration Tests: ${{ needs.integration-test.result }}"
          echo "=========================================="
