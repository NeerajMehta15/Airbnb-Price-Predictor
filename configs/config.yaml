# Airbnb Price Predictor Configuration

# Data Configuration
data:
  raw_data_path: "data/processed/1.Listing_details_1.csv"
  train_test_split: 0.2
  random_state: 21

  # Feature columns to use for modeling
  feature_columns:
    - "neighbourhood_group_cleansed"
    - "property_type"
    - "room_type"
    - "accommodates"
    - "bathrooms_text"
    - "beds"
    - "number_of_reviews"
    - "review_scores_rating"
    - "reviews_per_month"
    - "price"

  # Property types to extract
  property_types:
    - "rental unit"
    - "serviced apartment"
    - "condo"
    - "hotel"
    - "home"
    - "boutique hotel"
    - "townhouse"
    - "aparthotel"
    - "hostel"
    - "bungalow"
    - "bed and breakfast"
    - "guesthouse"
    - "villa"

# Price binning configuration
price_bins:
  edges: [0, 50, 100, 150, 200, 500, 1000, .inf]
  labels: ["0-50", "51-100", "101-150", "151-200", "201-500", "501-1000", "1000+"]

# Model Configuration
model:
  model_path: "Model/best_random_forest_model.joblib"
  model_type: "RandomForestClassifier"

  # Hyperparameter grid for tuning
  hyperparameters:
    n_estimators: [50, 100, 200]
    max_features: ["sqrt", "log2"]
    max_depth: [10, 20, 30]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]

  # Grid search configuration
  grid_search:
    cv: 5
    scoring: "accuracy"
    n_jobs: -1
    verbose: 2

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  title: "Airbnb Price Predictor API"
  version: "1.0.0"
  description: "Machine Learning API for predicting Airbnb listing price categories"

# AWS Configuration
aws:
  region: "us-east-1"
  ecr_repository: "airbnb-price-predictor"
  ecs_cluster: "airbnb-ml-cluster"
  ecs_service: "airbnb-predictor-service"
  s3_bucket: "airbnb-ml-models"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
